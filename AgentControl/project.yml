name: AgentControl
options:
  bundleIdPrefix: com.agentsessioncontrol
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15"

packages:
  AgentSessionControl:
    path: ../

targets:
  AgentControl:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    dependencies:
      - package: AgentSessionControl
        product: iPhoneApp
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Agent Control"
        UILaunchScreen: {}
        NSCameraUsageDescription: "Used to scan the Mac Agent pairing QR code."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentsessioncontrol.iphone
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
